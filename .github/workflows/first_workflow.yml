name: first_workflow

on: push

jobs:
    first_job:
        runs-on: ubuntu-latest
        steps:
           - name: download code
             uses: actions/checkout@v4

           - name: download node
             uses: actions/setup-node@v4
             with:
              node-version: 24
              cache: npm

           - name: install dependency
             run: npm ci

           - name: create build
             run: npm run build

           - name: create artifacts
             uses: actions/upload-artifact@v4
             with:
              name: react-build
              path: dist/
              retention-days: 7